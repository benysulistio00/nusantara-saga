<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nusantara Saga — Prototipe</title>
<style>
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0d0a18;color:#f0e9d6;min-height:100vh;overflow-x:hidden}
  .wrap{max-width:980px;margin:0 auto;padding:14px}
  h1{margin:6px 0 2px;text-align:center;color:#f5c518;letter-spacing:3px;font-size:28px;text-shadow:0 2px 12px rgba(245,197,24,.4)}
  .sub{text-align:center;color:#b9a86a;margin:0 0 14px;font-size:13px}
  .panel{background:rgba(255,255,255,.045);border:1px solid rgba(245,197,24,.25);border-radius:12px;padding:12px;margin-bottom:12px}
  .panel h3{margin:0 0 10px;color:#f5c518;font-size:16px}
  .cards{display:flex;gap:10px;flex-wrap:wrap}
  .pick{flex:1;min-width:140px;background:rgba(0,0,0,.35);border:2px solid transparent;border-radius:10px;padding:10px;cursor:pointer;text-align:center;transition:all .15s}
  .pick:hover{border-color:#8a7a3a}
  .pick.sel{border-color:#f5c518;background:rgba(245,197,24,.12);box-shadow:0 0 12px rgba(245,197,24,.35)}
  .pick .ic{font-size:32px}
  .pick .nm{font-weight:bold;margin:4px 0}
  .pick .ds{font-size:12px;color:#cbbf9a}
  input#nm{background:#1c1830;border:1px solid #8a7a3a;color:#f0e9d6;border-radius:8px;padding:10px;font-size:16px;width:100%;box-sizing:border-box}
  #startBtn{display:block;width:100%;padding:14px;font-size:18px;font-weight:bold;background:linear-gradient(180deg,#f5c518,#c9960a);border:none;border-radius:10px;cursor:pointer;color:#241c05;margin-top:6px}
  #startBtn:disabled{opacity:.4;cursor:not-allowed}
  .hint{font-size:12px;color:#8f8465;text-align:center;margin-top:10px}
  /* ===== VILLAGE ===== */
  #village{position:relative;min-height:100vh;background:#0d0a18}
  #vbg{position:absolute;inset:0;background:url('assets/bg-desa.jpg') center/cover no-repeat;opacity:.9}
  #vbg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,20,.25) 0%,rgba(10,8,20,0) 35%,rgba(10,8,20,.55) 100%)}
  .vui{position:absolute;inset:0;z-index:5}
  #vStats{position:absolute;top:12px;left:12px;background:linear-gradient(180deg,#6b4a26,#4a3016);border:3px solid #8a5f2e;border-radius:12px;padding:10px 14px;min-width:230px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  #vStats .lv{position:absolute;top:-12px;left:-12px;background:radial-gradient(circle,#ffe98a,#c9960a);color:#3a2405;font-weight:bold;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid #8a5f2e}
  #vStats .nm{font-weight:bold;color:#ffe98a;font-size:17px;margin-left:34px}
  .vbar{height:12px;background:#241a10;border-radius:6px;overflow:hidden;margin-top:5px;border:1px solid rgba(255,255,255,.2)}
  .vbar>i{display:block;height:100%}
  .vbar.hp>i{background:linear-gradient(90deg,#d42a2a,#ff8a5a)}
  .vbar.td>i{background:linear-gradient(90deg,#2a6bd4,#5ac8ff)}
  .vbar.xp>i{background:linear-gradient(90deg,#7a5af5,#b49aff)}
  .vbarlabel{font-size:10px;color:#ffe9c0;margin-top:3px}
  #vCur{position:absolute;top:12px;right:12px;display:flex;gap:8px}
  .cur{background:linear-gradient(180deg,#6b4a26,#4a3016);border:3px solid #8a5f2e;border-radius:20px;padding:6px 14px;font-weight:bold;font-size:15px;color:#ffe98a}
  #vBuild{position:absolute;left:0;right:0;bottom:86px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 12px}
  .bld{background:linear-gradient(180deg,#f7ecd2,#e3cf9f);color:#5a3a16;border:3px solid #8a2e2e;border-radius:10px;padding:10px 18px;font-weight:bold;font-size:15px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.5);transition:transform .12s}
  .bld:hover{transform:translateY(-3px)}
  .bld.main{background:linear-gradient(180deg,#ffe98a,#e8b93a);border-color:#a8322e;font-size:17px}
  #vNav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:linear-gradient(180deg,#5a3a1c,#3a2410);border-top:3px solid #8a5f2e;padding:10px 6px;z-index:6}
  .nvi{flex:1;max-width:110px;background:none;border:none;color:#ffe9c0;font-size:12px;cursor:pointer;text-align:center;padding:4px}
  .nvi .ic{font-size:26px;display:block}
  .nvi:hover{color:#f5c518}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(10,8,18,.92);border:1px solid #f5c518;color:#ffe98a;padding:10px 20px;border-radius:20px;font-size:14px;display:none;z-index:100;white-space:nowrap}
  /* ===== BATTLE (fullscreen ala Ninja Saga) ===== */
  #battle{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:#0d0a18;overflow:hidden}
  #bBg{position:absolute;inset:0;background:url('assets/bg-hutan.jpg') center/cover no-repeat}
  #bBg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,3,12,.75) 0%,rgba(5,3,12,.12) 24%,rgba(5,3,12,0) 42%,rgba(5,3,12,.30) 74%,rgba(5,3,12,.82) 100%)}
  #bTop{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px 0;gap:8px}
  #bPlate{position:relative;background:linear-gradient(180deg,#4a2f16,#2b1a0c);border:3px solid #a8762e;border-radius:10px;padding:8px 14px 10px 54px;min-width:250px;max-width:330px;box-shadow:0 4px 16px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,220,130,.22)}
  #bLv{position:absolute;top:-13px;left:-13px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe98a,#c9960a 72%);border:3px solid #7a4d16;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3a2405;box-shadow:0 3px 8px rgba(0,0,0,.5)}
  #bLv span{font-size:9px;font-weight:bold;line-height:1}
  #bLv b{font-size:20px;line-height:1.05}
  #bPName{font-weight:bold;color:#ffd94d;font-size:17px;text-shadow:0 2px 3px #000;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bbar{position:relative;height:18px;background:#150c05;border:1px solid rgba(255,220,130,.35);border-radius:4px;overflow:hidden;margin-top:4px}
  .bbar>i{display:block;height:100%;transition:width .45s}
  .bbar.hp>i{background:linear-gradient(180deg,#ff8a6a,#c41f1f)}
  .bbar.td>i{background:linear-gradient(180deg,#6fd2ff,#1f5fc4)}
  .bbar.xp{height:8px}
  .bbar.xp>i{background:linear-gradient(180deg,#d0a8ff,#7a3ff5)}
  .bbar>span{position:absolute;right:6px;top:0;font-size:11px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000;line-height:17px}
  #bMid{display:flex;flex-direction:column;align-items:center;gap:6px}
  #bBuffs{display:flex;gap:5px;align-items:center;background:rgba(20,12,6,.82);border:2px solid #a8762e;border-radius:8px;padding:4px 10px;min-height:32px;min-width:110px;justify-content:center}
  .bbuff{font-size:19px;filter:drop-shadow(0 1px 2px #000)}
  #bTimer{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aa0b5,#3c3f4d 72%);border:3px solid #e2e2ea;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:bold;color:#fff;text-shadow:0 2px 3px #000;box-shadow:0 3px 10px rgba(0,0,0,.6)}
  #bRight{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  #bWave{background:rgba(20,12,6,.82);border:2px solid #a8762e;color:#ffd94d;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:bold;white-space:nowrap}
  #bSysRow{display:flex;gap:6px}
  .icobtn{background:rgba(20,12,6,.88);border:2px solid #a8762e;color:#ffe9c0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
  .icobtn:hover{border-color:#ffd94d}
  #bScene{position:relative;z-index:4;flex:1;min-height:0}
  .bspot{position:absolute;bottom:3%;display:flex;flex-direction:column;align-items:center;z-index:5}
  #bP{left:5%}
  .bfoe{right:5%;cursor:pointer}
  .bfoe.back{right:27%;z-index:4;filter:brightness(.82)}
  .bfoe.boss{right:3%}
  .bchar{transition:transform .28s ease;line-height:0}
  .bchar img{max-height:42vh;max-width:290px;width:auto;height:auto;filter:drop-shadow(0 12px 16px rgba(0,0,0,.7))}
  .bfoe.back .bchar img{max-height:30vh;max-width:210px}
  .bfoe.boss .bchar img{max-height:50vh;max-width:430px}
  .bshadow{width:190px;height:24px;margin-top:4px;background:radial-gradient(ellipse,rgba(0,0,0,.62),transparent 70%);border-radius:50%}
  .bfoe.boss .bshadow{width:280px}
  .bname{margin-top:6px;font-size:15px;font-weight:bold;color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 2px 4px #000;white-space:nowrap}
  .bhpwrap{width:200px;margin-top:3px}
  .bfoe.boss .bhpwrap{width:270px}
  .bhpbar{height:13px;background:rgba(12,6,2,.88);border:2px solid #6b4a26;border-radius:7px;overflow:hidden}
  .bhpbar>i{display:block;height:100%;background:linear-gradient(180deg,#ff8a6a,#c41f1f);transition:width .45s}
  .bhplabel{font-size:11px;color:#ffd9c9;text-shadow:0 1px 2px #000;text-align:center;margin-top:1px}
  .bstatus{font-size:13px;min-height:18px;margin-top:2px;text-shadow:0 1px 3px #000;color:#ffd97a}
  .bfoe.targeted .bchar img{filter:drop-shadow(0 0 20px #ff4a4a) drop-shadow(0 12px 16px rgba(0,0,0,.7))}
  .bspot.dead{opacity:.28;filter:grayscale(1)}
  .bspot.dead .bchar{animation:none}
  .char{animation:bob 2.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .lungeR{transform:translateX(130px)!important}
  .lungeL{transform:translateX(-130px)!important}
  .hitflash img{filter:brightness(2.4) saturate(.3) drop-shadow(0 0 16px #fff)!important}
  .castglow img{filter:drop-shadow(0 0 18px currentColor)}
  .proj{position:absolute;width:26px;height:26px;border-radius:50%;z-index:20;pointer-events:none;transition:left .45s ease-in,top .45s ease-in}
  .floater{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-weight:bold;font-size:24px;pointer-events:none;animation:floatUp 1.1s forwards;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;z-index:30;white-space:nowrap;color:#fff}
  .floater.crit{color:#ffdd33;font-size:30px}
  .floater.miss{color:#bbb}
  .floater.heal{color:#7dff9a}
  .floater.dot{color:#ff9a5a}
  .floater.khodam{color:#d0a8ff}
  @keyframes floatUp{0%{opacity:1;top:18%}100%{opacity:0;top:-18%}}
  #bFeed{position:relative;z-index:5;text-align:center;padding:3px 12px;min-height:26px}
  #bFeedT{display:inline-block;font-size:13px;color:#ffe9c0;text-shadow:0 1px 3px #000;background:rgba(8,5,2,.62);padding:4px 16px;border-radius:14px;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bActions{position:relative;z-index:5;display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 10px;flex-wrap:wrap}
  #bJutsu{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .jsk{position:relative;width:64px;height:64px;background:linear-gradient(180deg,#3a2c1a,#191008);border:3px solid #6a5f9a;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.55)}
  .jsk:hover:not(:disabled){transform:translateY(-3px);border-color:#ffd94d!important;box-shadow:0 0 14px rgba(255,217,77,.45)}
  .jsk:disabled{opacity:.38;cursor:not-allowed}
  .jsk .jt{position:absolute;top:2px;left:5px;font-size:11px;font-weight:bold;color:#6fd2ff;text-shadow:0 1px 2px #000}
  .jsk .jc{position:absolute;inset:0;background:rgba(8,6,16,.75);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:#ff9a5a}
  #bCmd{display:flex;gap:10px}
  .cmd{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6b5236,#241a10 72%);border:3px solid #a8762e;color:#ffe9c0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:23px;box-shadow:0 4px 10px rgba(0,0,0,.55);padding:0}
  .cmd small{font-size:8.5px;font-weight:bold;margin-top:1px;line-height:1.1;text-align:center}
  .cmd:hover:not(:disabled){border-color:#ffd94d;transform:translateY(-2px)}
  .cmd:disabled{opacity:.38;cursor:not-allowed}
  #bBottom{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 14px 12px}
  #bTurnInfo{font-size:13px;color:#ffd94d;background:rgba(20,12,6,.85);border:2px solid #a8762e;border-radius:16px;padding:5px 16px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
  #bMenuRow{display:flex;gap:6px}
  #bLogPanel{position:absolute;z-index:30;left:12px;bottom:150px;width:min(430px,92vw);max-height:38vh;overflow-y:auto;background:rgba(8,5,2,.94);border:2px solid #a8762e;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.55;display:none;color:#f0e9d6}
  #bLogPanel.show{display:block}
  #bLogPanel div{margin-bottom:2px}
  .bfoe.back2{right:46%;z-index:3;filter:brightness(.72)}
  .bfoe.back2 .bchar img{max-height:26vh;max-width:180px}
  .bfoe.back2 .bhpwrap{width:150px}
  .bfoe.flip .bchar{transform:scaleX(-1)}
  .bfoe.flip .bchar.lungeL{transform:scaleX(-1) translateX(-130px)!important}
  .bfoe.flip .bchar.lungeR{transform:scaleX(-1) translateX(130px)!important}
  @media(max-width:700px){ .bfoe.back2{display:none} }
  /* ===== MODAL / HALAMAN DESA ===== */
  #modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}
  #modal.show{display:flex}
  #modalBox{background:linear-gradient(180deg,#251a10,#151009);border:3px solid #a8762e;border-radius:14px;width:92vw;max-width:660px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 12px 44px rgba(0,0,0,.75)}
  #modalHead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid #a8762e;color:#ffd94d;font-size:17px;font-weight:bold}
  #modalX{background:none;border:2px solid #a8762e;color:#ffe9c0;border-radius:8px;cursor:pointer;padding:4px 12px;font-size:15px}
  #modalX:hover{border-color:#ffd94d}
  #modalBody{padding:14px 16px;overflow-y:auto;color:#f0e9d6}
  #modalBody h4{color:#f5c518;margin:16px 0 8px}
  #modalBody p{line-height:1.6}
  .pick.locked{opacity:.45;cursor:not-allowed}
  .pick .jbtn{margin-top:6px}
  @media(max-width:700px){
    #bPlate{min-width:190px;padding:6px 10px 8px 48px}
    #bPName{font-size:14px}
    #bLv{width:48px;height:48px;top:-10px;left:-10px}
    #bLv b{font-size:16px}
    .bchar img{max-height:30vh;max-width:200px}
    .bfoe.boss .bchar img{max-height:36vh;max-width:280px}
    .bfoe.back{display:none}
    #bP{left:2%}.bfoe{right:2%}
    .jsk,.cmd{width:54px;height:54px;font-size:25px}
    #bMid{display:none}
    #bWave{font-size:11px}
  }
  #banner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);z-index:50}
  #banner.show{display:flex}
  #banner .t{font-size:32px;font-weight:bold;color:#f5c518;text-shadow:0 3px 10px #000;animation:pop .5s;text-align:center;padding:0 16px}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  #endOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:60}
  #endOverlay.show{display:flex}
  #endOverlay .box{background:#1c1830;border:2px solid #f5c518;border-radius:14px;padding:26px;max-width:420px;text-align:center;margin:0 14px}
  #endOverlay h2{color:#f5c518;margin-top:0}
  .bigbtn{padding:12px 26px;font-size:16px;font-weight:bold;background:linear-gradient(180deg,#f5c518,#c9960a);border:none;border-radius:8px;cursor:pointer;color:#241c05;margin-top:12px;margin-right:8px}
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<div class="wrap" id="setup">
  <h1>⚔️ NUSANTARA SAGA ⚔️</h1>
  <p class="sub">Prototipe v0.3 — Dunia Nusa Dwipa</p>
  <div class="panel"><h3>1. Nama Pendekar</h3><input id="nm" maxlength="16" placeholder="cth: Jaka Wulung"></div>
  <div class="panel"><h3>2. Pilih Afinitas Elemen</h3><div class="cards" id="elCards"></div></div>
  <div class="panel"><h3>3. Pilih Senjata</h3><div class="cards" id="wpCards"></div></div>
  <div class="panel"><h3>4. Pilih Khodam Pendamping</h3><div class="cards" id="khCards"></div></div>
  <button id="startBtn" disabled>MASUK DESA WANAGIRI ⚔️</button>
  <p class="hint">Jurus berelemen sama dengan afinitasmu dapat bonus Resonansi +15%.</p>
</div>

<!-- ============ VILLAGE ============ -->
<div id="village" style="display:none">
  <div id="vbg"></div>
  <div class="vui">
    <div id="vStats"></div>
    <div id="vCur"></div>
    <div id="vBuild">
      <button class="bld main" data-b="misi">⚔️ Misi</button>
      <button class="bld" data-b="arena">🏟️ Arena</button>
      <button class="bld" data-b="warung">🍜 Warung</button>
      <button class="bld" data-b="pasar">🏪 Pasar</button>
      <button class="bld" data-b="padepokan">⛩️ Padepokan</button>
      <button class="bld" data-b="petshop">🐾 Pet Shop</button>
    </div>
    <div id="vNav">
      <button class="nvi" data-n="profil"><span class="ic">👤</span>Profil</button>
      <button class="nvi" data-n="gear"><span class="ic">🗡️</span>Gear</button>
      <button class="nvi" data-n="jurus"><span class="ic">📜</span>Jurus</button>
      <button class="nvi" data-n="khodam"><span class="ic">👻</span>Khodam</button>
      <button class="nvi" data-n="opsi"><span class="ic">⚙️</span>Opsi</button>
    </div>
  </div>
  <div id="toast"></div>
</div>

<!-- ============ BATTLE ============ -->
<div id="battle" style="display:none">
  <div id="bBg"></div>
  <div id="bTop">
    <div id="bPlate">
      <div id="bLv"><span>Lv</span><b id="bLvN">1</b></div>
      <div id="bPName">-</div>
      <div class="bbar hp"><i id="bHpI"></i><span id="bHpT"></span></div>
      <div class="bbar td"><i id="bTdI"></i><span id="bTdT"></span></div>
      <div class="bbar xp"><i id="bXpI"></i></div>
    </div>
    <div id="bMid">
      <div id="bBuffs"></div>
      <div id="bTimer"><b id="bTurnN">1</b></div>
    </div>
    <div id="bRight">
      <div id="bWave">-</div>
      <div id="bSysRow">
        <button class="icobtn" id="bLogBtn" title="Jurnal battle">📜</button>
        <button class="icobtn" id="muteBtn">🔊</button>
        <button class="icobtn" id="backBtn">← Desa</button>
      </div>
    </div>
  </div>
  <div id="bScene">
    <div class="bspot" id="bP"></div>
    <div id="bE"></div>
  </div>
  <div id="bFeed"><span id="bFeedT">Bersiap...</span></div>
  <div id="bActions">
    <div id="bJutsu"></div>
    <div id="bCmd"></div>
  </div>
  <div id="bBottom">
    <div id="bTurnInfo">-</div>
    <div id="bMenuRow">
      <button class="icobtn" data-soon title="Chat">💬</button>
      <button class="icobtn" data-soon title="Gear">🎒</button>
      <button class="icobtn" data-soon title="Opsi">⚙️</button>
    </div>
  </div>
  <div id="bLogPanel"></div>
</div>

function scenePos(el){
  const s=$('bScene').getBoundingClientRect(), r=el.getBoundingClientRect();
  return {x:r.left-s.left+r.width/2, y:r.top-s.top+r.height/2};
}
function fireProjectile(fromEl, toEl, color, cb){
  if(!fromEl || !toEl){ cb&&cb(); return; }
  const a=scenePos(fromEl), b=scenePos(toEl);
  const p=document.createElement('div'); p.className='proj';
  p.style.cssText=`left:${a.x-13}px;top:${a.y-13}px;background:radial-gradient(circle,#fff 18%,${color} 55%,transparent 78%);box-shadow:0 0 16px ${color},0 0 32px ${color}`;
  $('bScene').appendChild(p);
  requestAnimationFrame(()=>{ p.style.left=(b.x-13)+'px'; p.style.top=(b.y-13)+'px'; });
  setTimeout(()=>{ p.remove(); hitFlash(toEl); cb&&cb(); }, 500);
}
function animateMelee(el, dir, targetEl, cb){
  if(!el){ cb&&cb(); return; }
  el.classList.add(dir>0?'lungeR':'lungeL');
  setTimeout(()=>{ el.classList.remove('lungeR','lungeL'); hitFlash(targetEl); cb&&cb(); }, 320);
}
function hitFlash(el){

function castGlow(el, color){

function floatDmg(spotEl, txt, cls){

  const d=document.createElement('div');

}
function beep(f, d){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='square'; o.frequency.value=f; g.gain.value=0.04;
    o.connect(g); g.connect(AC.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+d); o.stop(AC.currentTime+d);
  }catch(e){}
}
function log(html){
  const l=$('bLogPanel'); const d=document.createElement('div'); d.innerHTML=html;

}

// ================= COMBAT CORE =================
function calcDamage(att, def, mult, el, opts){
  opts = opts || {};
  if(att.accDeb>0 && Math.random()<att.accDeb) return {miss:true};
  if(Math.random() < ((def.buff&&def.buff.dodge)||0) + (def.dodge||0)) return {miss:true, dodged:true};
  let m = mult * (0.9 + Math.random()*0.2);
  const notes = [];
  if(el && el!=='netral' && def.el){
    if(ELEMENTS[el].counter===def.el){ m*=1.25; notes.push('⚡ COUNTER! +25%'); }
    else if(ELEMENTS[def.el].counter===el){ m*=0.75; notes.push('Ter-counter musuh...'); }
    if(att.affinity && el===att.affinity){ m*=1.15; notes.push('Resonansi +15%'); }
  }
  const crit = Math.random() < ((att.crit||0) + (opts.critBonus||0));
  if(crit) m *= 1.5;
  let dmg = Math.max(1, Math.round(att.atk * m));
  if(def.buff && def.buff.def>0){ dmg = Math.max(1, Math.round(dmg*0.5)); notes.push('🛡️ Ditahan (-50%)'); }
  if(def.buff && def.buff.shield>0){
    const ab = Math.min(def.buff.shield, dmg);
    def.buff.shield -= ab; dmg -= ab;
    notes.push('🛡️ Perisai menyerap '+ab);
    if(dmg<=0) return {dmg:0, crit, notes, absorbed:true};
  }
  return {dmg, crit, notes};
}
function applyDamage(c, dmg){
  c.hp = Math.max(0, c.hp - dmg);
  if(c.hp<=0 && c.alive){ c.alive=false; log(`💀 <b>${c.name}</b> tumbang!`); }
}
function addDot(c, dmg, dur){ c.dots.push({dmg, dur}); }
function startTurnTick(c){
  c.dots.forEach(dt=>{ if(c.alive){ applyDamage(c, dt.dmg); log(`🔥 ${c.name} terbakar: -${dt.dmg} HP`); floatDmg(c.spotEl, '-'+dt.dmg, 'dot'); hitFlash(c.svgEl); } dt.dur--; });
  c.dots = c.dots.filter(dt=>dt.dur>0);
  if(c.buff.dodgeDur>0){ c.buff.dodgeDur--; if(!c.buff.dodgeDur) c.buff.dodge=0; }
  if(c.buff.shieldDur>0){ c.buff.shieldDur--; if(!c.buff.shieldDur) c.buff.shield=0; }
  c.buff.def = 0;
  if(c.accDebDur>0){ c.accDebDur--; if(!c.accDebDur) c.accDeb=0; }
  for(const k in c.cds) if(c.cds[k]>0) c.cds[k]--;
  if(c===P && P.khodamCd>0) P.khodamCd--;
}

// ================= PLAYER ACTIONS =================
function hitEnemy(t, j, opts){
  const r = calcDamage(P, t, jurusMult(j), j.el, opts||{});
  if(r.miss){ log(`💨 ${t.name} menghindar dari ${j.name}!`); floatDmg(t.spotEl,'MISS','miss'); return 0; }
  applyDamage(t, r.dmg);
  floatDmg(t.spotEl, '-'+r.dmg + (r.crit?' CRIT!':''), r.crit?'crit':'');
  beep(r.crit?150:300, 0.12);
  (r.notes||[]).forEach(n=>log('<i>'+n+'</i>'));
  return r.dmg;
}
function applyJurus(j, t){
  if(j.type==='dmg'){
    const dealt = hitEnemy(t, j, {critBonus:j.critBonus||0});
    if(j.burn){ addDot(t, 10, j.burn); log(`🔥 ${t.name} terbakar (${j.burn} giliran)!`); }
    else if(j.burnChance && Math.random()<j.burnChance){ addDot(t, 10, 2); log(`🔥 ${t.name} terbakar (2 giliran)!`); }
    if(j.stunChance && Math.random()<j.stunChance && t.alive){ t.stun=true; log(`💫 <b>${t.name} terstun!</b>`); }
    if(j.lifesteal && dealt>0){ const h=Math.round(dealt*j.lifesteal); P.hp=Math.min(P.maxhp,P.hp+h); log(`💚 Menyerap ${h} HP!`); floatDmg(P.spotEl,'+'+h,'heal'); }
    if(j.accDebuff && t.alive){ t.accDeb=j.accDebuff; t.accDebDur=j.dur; log(`🌪️ Akurasi ${t.name} turun ${Math.round(j.accDebuff*100)}% (${j.dur} giliran)!`); }
    if(j.id==='gebrakan' && P.double>0 && Math.random()<P.double && t.alive){
      log(`🔱 <b>Serangan beruntun Tombak!</b>`);
      const r2 = calcDamage(P, t, 0.6, 'netral', {});
      if(!r2.miss){ applyDamage(t, r2.dmg); floatDmg(t.spotEl, '-'+r2.dmg, ''); hitFlash(t.svgEl); log(`${t.name} -${r2.dmg} HP.`); }
    }
    if(j.id==='gebrakan'){ P.td=Math.min(P.maxtd, P.td+10); log(`<i>+10 TD</i>`); }
  }
  else if(j.type==='def'){ P.buff.def=1; log(`🛡️ <b>${P.name}</b> pasang <b>Kuda-Kuda Wesi</b>!`); }
  else if(j.type==='buff'){ P.buff.dodge=j.dodge; P.buff.dodgeDur=j.dur; log(`💧 <b>Kabut Banyu</b> menyelimuti ${P.name}!`); }
  else if(j.type==='shield'){ P.buff.shield=j.amount; P.buff.shieldDur=j.dur; log(`🪨 <b>Tembok Lemah</b> melindungi ${P.name}!`); }
}
function useJurus(id){
  if(busy || !P.alive) return;
  const j = JURUS.find(x=>x.id===id);
  if(P.td < j.td || (P.cds[id]||0)>0) return;
  const t = EN[target];
  if(j.type==='dmg' && (!t || !t.alive)) return;
  busy = true; render();
  P.td -= j.td; P.cds[id] = j.cd;
  log(`🤺 <b>${P.name}</b> memakai <b>${ELEMENTS[j.el].icon} ${j.name}</b>!`);
  beep(500, 0.08);
  const go = ()=>{ applyJurus(j, t); afterPlayerAction(); };
  if(j.type==='dmg'){
    if(j.el==='netral') animateMelee(P.svgEl, 1, t.svgEl, go);
    else fireProjectile(P.svgEl, t.svgEl, ELCOLOR[j.el], go);
  } else {
    castGlow(P.svgEl, j.el==='netral' ? '#bbbbbb' : ELCOLOR[j.el]);
    setTimeout(go, 450);
  }
}
function useJamu(kind){
  if(busy || !P.alive) return;
  if(kind==='kuat'){
    if(P.jamuKuat<=0) return; P.jamuKuat--; SV.jamuKuat--;
    const h=Math.min(Math.round(P.maxhp*0.4), P.maxhp-P.hp);
    P.hp+=h; log(`🧪 <b>Jamu Kuat</b>: +${h} HP!`); floatDmg(P.spotEl,'+'+h,'heal');
  } else {
    if(P.jamuSegar<=0) return; P.jamuSegar--; SV.jamuSegar--;
    P.td=Math.min(P.maxtd, P.td+30); log(`🧪 <b>Jamu Segar</b>: +30 TD!`);
  }
  saveGame();
  beep(600,0.1); castGlow(P.svgEl, '#7dff9a');
  afterPlayerAction();
}
function khodamAuto(){
  const k = P.khodam, t = EN[target];
  if(!t || !t.alive) return;
  if(k.auto){
    fireProjectile(P.svgEl, t.svgEl, '#c99aff', ()=>{
      const dmg = Math.round(k.auto*kScale()*(0.9+Math.random()*0.2));
      applyDamage(t, dmg);
      log(`${k.icon} <b>${k.name}</b> membantu menyerang: -${dmg} ke ${t.name}!`);
      floatDmg(t.spotEl, '-'+dmg, 'khodam'); render();
    });
  } else if(k.autoHeal){
    const h = Math.min(k.autoHeal, P.maxhp-P.hp);
    P.hp += h;
    log(`${k.icon} <b>${k.name}</b> memulihkan ${h} HP untukmu!`);
    floatDmg(P.spotEl, '+'+h, 'heal'); castGlow(P.svgEl, '#7dff9a'); render();
  }
}
function khodamSpecial(){
  if(busy || !P.alive || P.khodamCd>0) return;
  const k = P.khodam, s = k.special, t = EN[target];
  if(s.dmg && (!t || !t.alive)) return;
  P.khodamCd = s.cd;
  log(`${k.icon} <b>${k.name}</b>: <b>⚡ ${s.name}</b>!`);
  beep(700, 0.15);
  const go = ()=>{
    if(s.dmg && t && t.alive){
      const r = calcDamage({atk:Math.round(s.dmg*kScale()), crit:s.crit||0, accDeb:0, affinity:null}, t, 1.0, 'netral', {});
      if(r.miss){ log(`💨 ${t.name} menghindar!`); floatDmg(t.spotEl,'MISS','miss'); }
      else{
        applyDamage(t, r.dmg);
        floatDmg(t.spotEl, '-'+r.dmg+(r.crit?' CRIT!':''), r.crit?'crit':'khodam');
        if(s.stunChance && Math.random()<s.stunChance && t.alive){ t.stun=true; log(`💫 <b>${t.name} terstun!</b>`); }
      }
    } else if(s.shield){
      P.buff.shield = s.shield; P.buff.shieldDur = s.dur;
      log(`🛡️ Perisai ${s.shield} melindungi ${P.name} (${s.dur} giliran)!`);
      castGlow(P.svgEl, '#8fb8ff');
    }
    render();
  };
  if(s.dmg) fireProjectile(P.svgEl, t.svgEl, '#c99aff', go);
  else { castGlow(P.svgEl, '#8fb8ff'); setTimeout(go, 400); }
}
function afterPlayerAction(){ busy = true; render(); setTimeout(nextTurn, 650); }

// ================= ENEMY AI =================
function enemyHit(e, moveName, mult, el){
  log(`👺 <b>${e.name}</b> memakai <b>${moveName}</b>!`);
  const apply = ()=>{
    const r = calcDamage(e, P, mult, el, {});
    if(r.miss){ log(`💨 <b>${P.name}</b> menghindar!`); floatDmg(P.spotEl,'MISS','miss'); return; }
    applyDamage(P, r.dmg);
    floatDmg(P.spotEl, '-'+r.dmg + (r.crit?' CRIT!':''), r.crit?'crit':'');
    beep(r.crit?150:300, 0.12);
    (r.notes||[]).forEach(n=>log('<i>'+n+'</i>'));
    if(!r.absorbed) log(`${P.name} -${r.dmg} HP.`);
    render();
  };
  if(el==='netral') animateMelee(e.svgEl, -1, P.svgEl, apply);
  else fireProjectile(e.svgEl, P.svgEl, ELCOLOR[el], apply);
}
function begalAI(e){
  if(!(e.cds.cakar>0) && Math.random()<0.35){ e.cds.cakar=3; enemyHit(e,'Cakaran Kala 😈',1.6,'netral'); }
  else enemyHit(e,'Cakaran',1.0,'netral');
}
function gagakAI(e){
  const opts = [];
  if(!(e.cds.sayap>0)) opts.push('sayap');
  if(!(e.cds.melesat>0) && e.hp < e.maxhp*0.7) opts.push('melesat');
  opts.push('basic'); opts.push('basic');
  const mv = opts[Math.floor(Math.random()*opts.length)];
  if(mv==='sayap'){ e.cds.sayap=3; enemyHit(e,'Kepakan Sayap 🌪️',1.4,'bayu'); }
  else if(mv==='melesat'){
    e.cds.melesat=4; e.buff.dodge=0.35; e.buff.dodgeDur=2;
    log(`🦅 <b>Gagak Ireng</b> memakai <b>Melesat</b>! Dodge +35% (2 giliran).`);
    castGlow(e.svgEl, '#8fffd0');
  }
  else enemyHit(e,'Patukan',1.0,'bayu');
}

// ================= TURN ENGINE =================
function ensureTarget(){
  if(!EN[target] || !EN[target].alive){
    const i = EN.findIndex(e=>e.alive);
    target = i>=0 ? i : 0;
  }
}
function beginRound(){
  roundNum++;
  turnQ = [P].concat(EN.filter(e=>e.alive)).sort((a,b)=>b.spd-a.spd);
  nextTurn();
}
function nextTurn(){
  ensureTarget();
  if(EN.every(e=>!e.alive)){ setTimeout(waveClear, 900); return; }
  if(!P.alive){ setTimeout(defeat, 900); return; }
  if(!turnQ.length){ beginRound(); return; }
  const c = turnQ.shift(); curFighter = c;
  if(!c.alive){ nextTurn(); return; }
  startTurnTick(c);
  render();
  if(!c.alive){ setTimeout(nextTurn, 600); return; }
  if(c===P){
    turnCount++;
    P.td = Math.min(P.maxtd, P.td + 12);
    log(`<b>— Giliran ${P.name} (ronde ${roundNum}) · +12 TD —</b>`);
    if(turnCount%2===0) khodamAuto();
    if(P.pet && turnCount%3===0) petAuto();
    busy = false; render();
  } else {
    busy = true; render();
    setTimeout(()=>{
      if(c.stun){ log(`💫 <b>${c.name}</b> terstun! Giliran terlewat.`); c.stun=false; }
      else if(c.alive){ enemyAI(c); }
      render(); setTimeout(nextTurn, 900);
    }, 700);
  }
}
function startWave(i){
  wave = i;
  const M = MISSIONS[missionIdx];
  EN = M.waves[i].enemies.map(makeEnemy);
  target = 0; turnCount = 0; roundNum = 0; turnQ = []; curFighter = null;
  P.hp=P.maxhp; P.td=P.maxtd; P.cds={}; P.dots=[]; P.stun=false; P.alive=true;
  P.buff={dodge:0,dodgeDur:0,shield:0,shieldDur:0,def:0}; P.accDeb=0; P.accDebDur=0;
  $('bWave').textContent = M.waves[i].label;
  buildArena();
  showBanner(M.waves[i].label);
  setTimeout(beginRound, 1900);
}
function waveClear(){
  if(battleMode==='arena'){ victory(); return; }
  const M = MISSIONS[missionIdx];
  if(wave < M.waves.length-1){
    showBanner('Gelombang bersih! 🎉');
    log(`✨ HP & TD pulih penuh. Bersiap untuk gelombang berikutnya...`);
    setTimeout(()=>startWave(wave+1), 2100);
  } else victory();
}
function victory(){
  if(battleMode==='arena'){
    const reward = 80+SV.level*40;
    SV.perak+=reward; SV.wins++; saveGame();
    log(`🏆 <b>MENANG TANDING!</b> +${reward} Perak!`);
    showEnd(true, `<ul style="text-align:left"><li>+${reward} Perak 🪙</li><li>Rekor tanding: <b>${SV.wins}M / ${SV.losses}K</b></li></ul>`,
      'Kembali ke Desa', ()=>{ $('endOverlay').classList.remove('show'); showVillage(); });
    return;
  }
  const M = MISSIONS[missionIdx];
  SV.xp += M.reward.xp; SV.perak += M.reward.perak;
  let lvHtml = '';
  while(SV.xp >= SV.level*100){
    SV.level++; SV.tenaga=TENAGA_MAX;
    lvHtml += `<li>⬆️ Naik ke <b>Level ${SV.level}</b>! ⚡ Tenaga penuh!</li>`;
  }
  if(!SV.missionsDone.includes(M.id)) SV.missionsDone.push(M.id);
  saveGame();
  log(`🏆 <b>MISI SELESAI!</b> ${M.outro}`);
  showEnd(true, `<ul style="text-align:left"><li>+${M.reward.xp} XP</li>${lvHtml}<li>+${M.reward.perak} Perak 🪙</li></ul><p><i>${M.next}</i></p>`,
    'Kembali ke Desa', ()=>{ $('endOverlay').classList.remove('show'); showVillage(); });
}
function defeat(){
  if(battleMode==='arena'){ SV.losses++; saveGame(); }
  showEnd(false, `<p>HP-mu habis... ${battleMode==='arena'?'Pendekar Bayangan menghilang sambil tertawa.':'Ki Ageng Wulung menyeretmu pulang untuk berlatih lagi.'}</p>`,
    'Kembali ke Desa', ()=>{ $('endOverlay').classList.remove('show'); showVillage(); });
}
function showEnd(win, html, btnLabel, btnFn){
  $('endBox').innerHTML = `<h2>${win?'🏆 MISI SELESAI!':'💀 KALAH'}</h2>${html}<button class="bigbtn" id="endBtn">${btnLabel}</button>`;
  $('endOverlay').classList.add('show');
  $('endBtn').onclick = btnFn;
}

// ================= RENDER =================
function statusText(c){
  const s = [];
  if(c.buff.shield>0) s.push(`🛡️${c.buff.shield}`);
  if(c.buff.dodge>0) s.push(`💨${Math.round(c.buff.dodge*100)}%`);
  if(c.buff.def>0) s.push('🧱½');
  if(c.dots.length) s.push(`🔥${c.dots.length}`);
  if(c.stun) s.push('💫');
  if(c.accDeb>0) s.push('🌪️');
  return s.join(' ');
}
function fighterHtml(c, isPlayer){
  const el = ELEMENTS[c.el];
  const lv = c.kind==='player' ? c.level : (c.level||1);
  return `<div class="bchar"><img class="char" src="${c.img}" alt="${c.name}"></div><div class="bshadow"></div>
    <div class="bname">Lv.${lv} ${c.name}</div>
    <div class="bhpwrap"><div class="bhpbar"><i style="width:${Math.round(c.hp/c.maxhp*100)}%"></i></div><div class="bhplabel">${c.hp}/${c.maxhp} ${el.icon} ${el.name}</div></div>
    <div class="bstatus">${statusText(c)}${isPlayer?` · ${c.khodam.icon} ${c.khodam.name}`:''}${isPlayer&&c.pet?` · ${c.pet.icon} ${c.pet.name}`:''}</div>`;
}
function renderSpot(el, c, isPlayer){
  el.innerHTML = fighterHtml(c, isPlayer);
  c.svgEl = el.querySelector('.bchar');
}
function buildArena(){
  const ps = $('bP');
  ps.innerHTML = fighterHtml(P, true);
  P.spotEl = ps; P.svgEl = ps.querySelector('.bchar');
  const w = $('bE'); w.innerHTML = '';
  EN.forEach((e, idx)=>{
    const d = document.createElement('div');
    const isBoss = ['gagak','ratu','senopati'].includes(e.kind);
    d.className = 'bspot bfoe' + (isBoss ? ' boss' : '') + (idx===1 ? ' back' : '') + (idx===2 ? ' back2' : '') + (e.kind==='rival' ? ' flip' : '');
    d.innerHTML = fighterHtml(e, false);
    d.onclick = ()=>{ if(!busy && e.alive){ target=idx; render(); beep(800,0.05); } };
    w.appendChild(d); e.spotEl = d; e.svgEl = d.querySelector('.bchar');
  });
  render();
}
function render(){
  if(!P) return;
  ensureTarget();
  $('bLvN').textContent = P.level;
  $('bPName').textContent = `${P.name} · ${ELEMENTS[P.el].icon} ${ELEMENTS[P.el].name} · ${P.weapon.icon}${P.weapon.name}`;
  $('bHpI').style.width = Math.max(0, P.hp/P.maxhp*100)+'%';
  $('bHpT').textContent = P.hp+'/'+P.maxhp;
  $('bTdI').style.width = Math.max(0, P.td/P.maxtd*100)+'%';
  $('bTdT').textContent = P.td+'/'+P.maxtd;
  const xpNeed = P.level*100;
  $('bXpI').style.width = Math.min(100, P.xp/xpNeed*100)+'%';
  $('bTurnN').textContent = Math.max(1, roundNum);
  const bb = [];
  if(P.buff.shield>0) bb.push('🛡️'+P.buff.shield); if(P.buff.dodge>0) bb.push('💨');
  if(P.buff.def>0) bb.push('🧱'); if(P.dots.length) bb.push('🔥'+P.dots.length);
  if(P.stun) bb.push('💫'); if(P.accDeb>0) bb.push('🌪️');
  $('bBuffs').innerHTML = bb.length ? bb.map(x=>`<span class="bbuff">${x}</span>`).join('') : '<span style="font-size:11px;color:#8f8465">—</span>';
  renderSpot($('bP'), P, true);
  $('bP').classList.toggle('dead', !P.alive);
  EN.forEach((e, idx)=>{
    if(!e.spotEl) return;
    renderSpot(e.spotEl, e, false);
    e.spotEl.classList.toggle('dead', !e.alive);
    e.spotEl.classList.toggle('targeted', idx===target && e.alive);
  });
  $('bTurnInfo').innerHTML = curFighter
    ? `⚔️ Giliran: <b>${curFighter.name}</b> · Ronde ${Math.max(1,roundNum)}`
    : (battleMode==='arena' ? 'Ajang Tanding' : MISSIONS[missionIdx].waves[wave].label);
  const bj = $('bJutsu'); bj.innerHTML = '';
  JURUS.forEach(j=>{
    const cd = P.cds[j.id]||0;
    const dis = busy || !P.alive || P.td<j.td || cd>0;
    const b = document.createElement('button');
    b.className = 'jsk'; b.disabled = dis; b.title = `${j.name} — ${j.desc} (TD ${j.td})`;
    b.style.borderColor = ELCOLOR[j.el] || '#6a5f9a';
    const ji = JIMG[j.id] ? `<img src="${JIMG[j.id]}" style="width:46px;height:46px;object-fit:contain;pointer-events:none" alt="">` : JICON[j.id];
    b.innerHTML = `<span class="jt">${j.td>0?j.td:''}</span><span>${ji}</span>` + (cd>0?`<span class="jc">${cd}</span>`:'');
    b.onclick = ()=>useJurus(j.id);
    bj.appendChild(b);
  });
  const bc = $('bCmd'); bc.innerHTML = '';
  const mkc = (icon, label, title, fn, dis)=>{
    const b = document.createElement('button'); b.className='cmd'; b.disabled=dis; b.title=title;
    b.innerHTML = `<span>${icon}</span><small>${label}</small>`;
    b.onclick = fn; bc.appendChild(b);
  };
  mkc(`<img src="${JIMG.jamuHp}" style="width:40px;height:40px;object-fit:contain;pointer-events:none">`, 'Jamu HP ×'+P.jamuKuat, 'Jamu Kuat: heal 40% HP', ()=>useJamu('kuat'), busy||!P.alive||P.jamuKuat<=0);
  mkc(`<img src="${JIMG.jamuTd}" style="width:40px;height:40px;object-fit:contain;pointer-events:none">`, 'Jamu TD ×'+P.jamuSegar, 'Jamu Segar: +30 TD', ()=>useJamu('segar'), busy||!P.alive||P.jamuSegar<=0);
  const k = P.khodam, s = k.special;
  mkc(k.icon, 'Khodam'+(P.khodamCd>0?' '+P.khodamCd:''), `⚡ ${s.name}: ${s.desc} (CD ${s.cd})`, khodamSpecial, busy||!P.alive||P.khodamCd>0);
}
function showBanner(txt){
  $('bannerText').textContent = txt;
  $('banner').classList.add('show');
  setTimeout(()=>$('banner').classList.remove('show'), 1750);
}


// ================= SAVE SYSTEM =================
const SAVE_KEY = 'nusantara_saga_v1';
const TENAGA_MAX = 50;
let SV = null;
let battleMode = 'mission', missionIdx = 0;
function defaultSave(picks){
  return {name:picks.name, element:picks.element, weaponId:picks.weapon, armorId:'kain',
    khodamId:picks.khodam, petId:null, level:1, xp:0, perak:150, mustika:0,
    tenaga:TENAGA_MAX, tenagaTs:Date.now(), missionsDone:[], jurusLv:{}, khodamLv:1,
    jamuKuat:2, jamuSegar:2, weaponsOwned:[picks.weapon], armorsOwned:['kain'], petsOwned:[],
    guildXp:0, wins:0, losses:0, muted:false};
}
function saveGame(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SV)); }catch(e){} }
function loadGame(){
  try{ const s=localStorage.getItem(SAVE_KEY); if(s){ SV=JSON.parse(s); return true; } }catch(e){}
  return false;
}
function tickTenaga(){
  const now=Date.now();
  const gain=Math.floor((now-SV.tenagaTs)/300000);
  if(gain>0 && SV.tenaga<TENAGA_MAX){
    SV.tenaga=Math.min(TENAGA_MAX, SV.tenaga+gain);
    SV.tenagaTs+=gain*300000; saveGame();
  }
}
function jurusMult(j){ const lv=(SV.jurusLv&&SV.jurusLv[j.id])||1; return j.mult*(1+0.12*(lv-1)); }
function kScale(){ return 1+0.15*((SV.khodamLv||1)-1); }

// ================= MODAL =================
function openPage(title, bodyHtml){
  $('modalTitle').textContent=title; $('modalBody').innerHTML=bodyHtml;
  $('modal').classList.add('show');
}
function closePage(){ $('modal').classList.remove('show'); }

// ================= HALAMAN: MISI =================
function pageMisi(){
  tickTenaga();
  let h = `<p style="color:#cbbf9a">⚡ Tenaga: <b style="color:#ffd94d">${SV.tenaga}/${TENAGA_MAX}</b> · 1 misi = 10 ⚡ (regen 1 per 5 mnt)</p><div class="cards">`;
  MISSIONS.forEach((m,i)=>{
    const locked = i>0 && !SV.missionsDone.includes(MISSIONS[i-1].id);
    const done = SV.missionsDone.includes(m.id);
    h += `<div class="pick ${locked?'locked':''}" ${locked?'':`onclick="tryStartMission(${i})"`}>
      <div class="ic">${locked?'🔒':m.icon}</div><div class="nm">${m.name}</div>
      <div class="ds">${m.desc}<br>🎁 ${m.reward.xp} XP + ${m.reward.perak} 🪙${done?' · ✅':''}</div></div>`;
  });
  openPage('⚔️ Pilih Misi', h+'</div>');
}
function tryStartMission(i){
  tickTenaga();
  if(SV.tenaga<10){ toast('⚡ Tenaga kurang! Tunggu regen atau traktir di Warung 🍛'); return; }
  SV.tenaga-=10; saveGame();
  closePage(); startMission(i);
}

// ================= HALAMAN: ARENA =================
function pageArena(){
  openPage('🏟️ Ajang Tanding', `<p style="color:#cbbf9a">Uji nyali melawan <b>Pendekar Bayangan</b> — bayangan dirimu sendiri! Menang dapat 🪙, kalah tidak mengurangi apa-apa.</p>
  <p>🪙 Hadiah: <b>${80+SV.level*40}</b> · Rekor: <b>${SV.wins}M / ${SV.losses}K</b></p>
  <button class="bigbtn" onclick="startArena()">MULAI TANDING ⚔️</button>`);
}
function startArena(){
  closePage(); battleMode='arena'; missionIdx=-1;
  P=makePlayer(); muted=SV.muted;
  $('village').style.display='none'; $('battle').style.display='block';
  $('bLogPanel').innerHTML=''; $('muteBtn').textContent=muted?'🔇':'🔊';
  EN=[makeRival()]; target=0; turnCount=0; roundNum=0; turnQ=[]; curFighter=null;
  $('bWave').textContent='Ajang Tanding — 1 vs 1';
  buildArena(); showBanner('PENDEKAR BAYANGAN MENANTANGMU!');
  log(`🏟️ <b>Ajang Tanding</b>: ${P.name} vs <b>Pendekar Bayangan</b>!`);
  setTimeout(beginRound, 1900);
}

// ================= HALAMAN: WARUNG =================
function pageWarung(){
  openPage('🍜 Warung Mbok Darmi', `
  <p style="color:#cbbf9a"><i>"Monggo, pendekar! Jamu anget siap sedia~"</i> — Mbok Darmi</p>
  <p>🪙 Perakmu: <b>${SV.perak}</b> · ⚡ Tenaga: <b>${SV.tenaga}/${TENAGA_MAX}</b></p>
  <div class="cards">
    <div class="pick"><div class="ic"><img src="assets/icon-jamu-hp.png" style="width:44px;height:44px"></div><div class="nm">Jamu Kuat</div><div class="ds">Heal 40% HP di battle<br>Punya: ${SV.jamuKuat}<br><button class="jbtn" onclick="buyJamu('kuat')"><b>50 🪙</b> Beli</button></div></div>
    <div class="pick"><div class="ic"><img src="assets/icon-jamu-td.png" style="width:44px;height:44px"></div><div class="nm">Jamu Segar</div><div class="ds">+30 TD di battle<br>Punya: ${SV.jamuSegar}<br><button class="jbtn" onclick="buyJamu('segar')"><b>40 🪙</b> Beli</button></div></div>
    <div class="pick"><div class="ic">🍛</div><div class="nm">Nasi Liwet</div><div class="ds">Traktir Mbok Darmi<br>+5 ⚡ Tenaga<br><button class="jbtn" onclick="traktir()"><b>20 🪙</b></button></div></div>
  </div>`);
}
function buyJamu(k){
  const price=k==='kuat'?50:40;
  if(SV.perak<price){ toast('🪙 Perak kurang!'); return; }
  SV.perak-=price; if(k==='kuat')SV.jamuKuat++; else SV.jamuSegar++;
  saveGame(); toast('🧪 Jamu dibeli!'); pageWarung(); renderVillage();
}
function traktir(){
  if(SV.perak<20){ toast('🪙 Perak kurang!'); return; }
  if(SV.tenaga>=TENAGA_MAX){ toast('⚡ Tenaga sudah penuh!'); return; }
  SV.perak-=20; SV.tenaga=Math.min(TENAGA_MAX,SV.tenaga+5); saveGame();
  toast('🍛 Kenyang! +5 Tenaga'); pageWarung(); renderVillage();
}

// ================= HALAMAN: PASAR =================
function shopCard(item, owned, eq, buyFn, eqFn){
  return `<div class="pick"><div class="ic" style="font-size:36px">${item.icon}</div><div class="nm">${item.name}</div>
  <div class="ds">${item.desc}<br>${
    eq?'<b style="color:#7dff9a">✓ Terpasang</b>'
    :owned?`<button class="jbtn" onclick="${eqFn}('${item.id}')">Pasang</button>`
    :`<button class="jbtn" onclick="${buyFn}('${item.id}')"><b>${item.price} 🪙</b> Beli</button>`}</div></div>`;
}
function pagePasar(){
  let h=`<p style="color:#cbbf9a">🪙 Perakmu: <b>${SV.perak}</b></p><h4>Senjata</h4><div class="cards">`;
  WEAPONS.forEach(w=>{ h+=shopCard(w, SV.weaponsOwned.includes(w.id), SV.weaponId===w.id, 'buyWeapon', 'equipWeapon'); });
  h+=`</div><h4>Zirah</h4><div class="cards">`;
  ARMORS.forEach(a=>{ h+=shopCard(a, SV.armorsOwned.includes(a.id), SV.armorId===a.id, 'buyArmor', 'equipArmor'); });
  openPage('🏪 Pasar Wanagiri', h+'</div>');
}
function buyWeapon(id){ buyItem(WEAPONS, id, 'weaponsOwned', pagePasar); }
function buyArmor(id){ buyItem(ARMORS, id, 'armorsOwned', pagePasar); }
function buyItem(list, id, ownedKey, refreshFn){
  const it=list.find(x=>x.id===id);
  if(SV[ownedKey].includes(id)) return;
  if(SV.perak<it.price){ toast('🪙 Perak kurang!'); return; }
  SV.perak-=it.price; SV[ownedKey].push(id); saveGame();
  toast(`${it.icon} ${it.name} dibeli!`); refreshFn(); renderVillage();
}
function equipWeapon(id){ SV.weaponId=id; saveGame(); toast('🗡️ '+WEAPONS.find(w=>w.id===id).name+' dipasang!'); pagePasar(); renderVillage(); }
function equipArmor(id){ SV.armorId=id; saveGame(); toast('🛡️ '+ARMORS.find(a=>a.id===id).name+' dipakai!'); pagePasar(); renderVillage(); }

// ================= HALAMAN: PADEPOKAN =================
function pagePadepokan(){
  const glv=1+Math.floor(SV.guildXp/500);
  openPage('⛩️ Padepokan Girilaya', `<p style="color:#cbbf9a"><i>"Giri" itu gunung, "laya" itu tempat bernaung. Di sinilah pendekar ditempa.</i> — Ki Ageng Wulung</p>
  <p>👥 Anggota: <b>1.247</b> pendekar<br>⭐ Level Padepokan: <b>${glv}</b> (${SV.guildXp} XP)</p>
  <p style="color:#cbbf9a">Sumbang Perak untuk kejayaan padepokan! 🪙 ${SV.perak}</p>
  <button class="jbtn" onclick="donate(100)"><b>100 🪙</b></button>
  <button class="jbtn" onclick="donate(500)"><b>500 🪙</b></button>`);
}
function donate(n){
  if(SV.perak<n){ toast('🪙 Perak kurang!'); return; }
  SV.perak-=n; SV.guildXp+=n; saveGame();
  toast('⛩️ Terima kasih atas sumbanganmu!'); pagePadepokan(); renderVillage();
}

// ================= HALAMAN: PET SHOP =================
function pagePetshop(){
  let h=`<p style="color:#cbbf9a">Kawan Siluman bertarung bersamamu <b>tiap 3 giliran</b>! 🪙 ${SV.perak}</p><div class="cards">`;
  PETS.forEach(pt=>{
    const owned=SV.petsOwned.includes(pt.id), eq=SV.petId===pt.id;
    h+=`<div class="pick"><div class="ic" style="font-size:40px">${pt.icon}</div><div class="nm">${pt.name}</div><div class="ds">${pt.desc}<br>${

      :owned?`<button class="jbtn" onclick="equipPet('${pt.id}')">Ajak</button>`
      :`<button class="jbtn" onclick="buyPet('${pt.id}')"><b>${pt.price} 🪙</b> Beli</button>`}</div></div>`;
  });

}
function buyPet(id){
  const pt=PETS.find(x=>x.id===id);

  SV.perak-=pt.price; SV.petsOwned.push(id); SV.petId=id; saveGame();
  toast(`${pt.icon} ${pt.name} menjadi kawanmu!`); pagePetshop(); renderVillage();
}
function equipPet(id){ SV.petId=id; saveGame(); toast('🐾 '+PETS.find(p=>p.id===id).name+' ikut bertarung!'); pagePetshop(); renderVillage(); }

// ================= HALAMAN: PROFIL =================

   ⚡ Tenaga: ${SV.tenaga}/${TENAGA_MAX}</div>`);

// ================= HALAMAN: GEAR =================
function pageGear(){
  const st=pStats();
  let h=`<p style="color:#cbbf9a">⚔️ ATK <b>${st.atk}</b> · ❤️ Max HP <b>${st.maxhp}</b> · 🌀 Max TD <b>${st.maxtd}</b></p><h4>Senjata</h4><div class="cards">`;
  SV.weaponsOwned.forEach(id=>{
    const w=WEAPONS.find(x=>x.id===id), eq=SV.weaponId===id;

    <div class="ds">ATK ${w.atk} · ${w.desc}<br>${eq?'<b style="color:#7dff9a">✓ Terpasang</b>':`<button class="jbtn" onclick="equipGearW('${id}')">Pasang</button>`}</div></div>`;
  });
  h+=`</div><h4>Zirah</h4><div class="cards">`;
  SV.armorsOwned.forEach(id=>{
    const a=ARMORS.find(x=>x.id===id), eq=SV.armorId===id;
    h+=`<div class="pick ${eq?'sel':''}"><div class="ic" style="font-size:34px">${a.icon}</div><div class="nm">${a.name}</div>
    <div class="ds">${a.desc}<br>${eq?'<b style="color:#7dff9a">✓ Dipakai</b>':`<button class="jbtn" onclick="equipGearA('${id}')">Pakai</button>`}</div></div>`;
  });
  h+=`</div><p><button class="jbtn" onclick="closePage();pagePasar()">🏪 Beli di Pasar</button></p>`;
  openPage('🗡️ Gear', h);

function equipGearW(id){ SV.weaponId=id; saveGame(); pageGear(); renderVillage(); toast('🗡️ Senjata diganti!'); }
function equipGearA(id){ SV.armorId=id; saveGame(); pageGear(); renderVillage(); toast('🛡️ Zirah diganti!'); }

// ================= HALAMAN: JURUS =================
function pageJurus(){
  let h=`<p style="color:#cbbf9a">Tingkatkan jurus dengan Perak — tiap level <b>+12% damage</b>. 🪙 ${SV.perak}</p><div class="cards">`;
  JURUS.forEach(j=>{
    const lv=(SV.jurusLv[j.id]||1), maxed=lv>=5, cost=100*lv*lv;
    const icon=JIMG[j.id]?`<img src="${JIMG[j.id]}" style="width:44px;height:44px;object-fit:contain">`:JICON[j.id];
    h+=`<div class="pick"><div class="ic">${icon}</div><div class="nm">${j.name} <span style="color:#ffd94d">Lv.${lv}</span></div>
    <div class="ds">${ELEMENTS[j.el].icon} ${j.desc}<br>${maxed?'<b style="color:#ffd94d">MAX</b>':`<button class="jbtn" onclick="upJurus('${j.id}')">⬆️ ${cost} 🪙</button>`}</div></div>`;
  });
  openPage('📜 Jurus', h+'</div>');
}
function upJurus(id){
  const lv=(SV.jurusLv[id]||1); if(lv>=5) return;
  const cost=100*lv*lv;
  if(SV.perak<cost){ toast('🪙 Perak kurang!'); return; }
  SV.perak-=cost; SV.jurusLv[id]=lv+1; saveGame();
  toast(`📜 ${JURUS.find(j=>j.id===id).name} naik ke Lv.${lv+1}!`); pageJurus(); renderVillage();
}

// ================= ENEMY AI BARU =================
function silumanAI(e){
  if(!(e.cds.cengkeram>0) && Math.random()<0.35){ e.cds.cengkeram=3; enemyHit(e,'Cengkeraman Lumpur',1.5,'banyu'); }
  else enemyHit(e,'Lumpur Rawa',1.05,'banyu');
}
function ratuAI(e){
  const opts=[];
  if(!(e.cds.gelombang>0)) opts.push('gelombang');
  if(!(e.cds.kutukan>0) && e.hp<e.maxhp*0.75) opts.push('kutukan');
  opts.push('basic'); opts.push('basic');
  const mv=opts[Math.floor(Math.random()*opts.length)];
  if(mv==='gelombang'){ e.cds.gelombang=3; enemyHit(e,'Gelombang Rawa 🌊',1.5,'banyu'); }
  else if(mv==='kutukan'){
    e.cds.kutukan=4; P.accDeb=0.3; P.accDebDur=2;
    log(`🌊 <b>Ratu Rawa</b> mengutukmu! Akurasimu -30% (2 giliran).`);
    castGlow(e.svgEl,'#4db8ff');
  }
  else enemyHit(e,'Trisula Karang',1.1,'banyu');
}
function senopatiAI(e){
  const opts=[];
  if(!(e.cds.tebasan>0)) opts.push('tebasan');
  if(!(e.cds.amuk>0) && e.hp<e.maxhp*0.7) opts.push('amuk');
  opts.push('basic'); opts.push('basic');
  const mv=opts[Math.floor(Math.random()*opts.length)];
  if(mv==='tebasan'){ e.cds.tebasan=3; enemyHit(e,'Tebasan Kala 😈',1.6,'netral'); }
  else if(mv==='amuk'){ e.cds.amuk=4; enemyHit(e,'Amuk Geni Hitam 🔥',1.5,'geni'); }
  else enemyHit(e,'Pedang Kala',1.15,'netral');
}
function rivalAI(e){
  if(Math.random()<0.5) enemyHit(e,'Tebasan Bayangan',1.1,'netral');
  else enemyHit(e,'Jurus Bayangan',1.35,e.el);
}
function enemyAI(c){
  if(c.kind==='begal') begalAI(c);
  else if(c.kind==='gagak') gagakAI(c);
  else if(c.kind==='siluman') silumanAI(c);
  else if(c.kind==='ratu') ratuAI(c);
  else if(c.kind==='senopati') senopatiAI(c);
  else rivalAI(c);
}

// ================= PET =================
function petAuto(){
  const pt=P.pet, t=EN[target];
  if(!pt || !t || !t.alive) return;
  fireProjectile(P.svgEl, t.svgEl, '#ffd94d', ()=>{
    const dmg=Math.round(pt.dmg*(0.9+Math.random()*0.2));
    applyDamage(t,dmg);
    log(`${pt.icon} <b>${pt.name}</b> menyerang: -${dmg} ke ${t.name}!`);
    floatDmg(t.spotEl,'-'+dmg,'khodam');
    if(pt.burn && t.alive){ addDot(t,pt.burn,2); log(`🔥 ${t.name} terbakar oleh ${pt.name}!`); }
    render();
  });
}
